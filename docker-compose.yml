services:
  feishu-topics-encrypted:
    build:
      context: .
      dockerfile: Dockerfile
    image: feishu-topics-encrypted:latest
    container_name: feishu-topics-encrypted
    restart: unless-stopped
    ports:
      - "127.0.0.1:8087:8087"
    environment:
      - TZ=Asia/Shanghai
      - ADDR=0.0.0.0:8087
      - ALLOW_ANY_HOST=1
      # 下载文件在宿主机上的真实位置（加密版独立保存）
      - FEISHU_HOST_DOWNLOAD_DIR=${FEISHU_HOST_DOWNLOADS:-${HOME}/Documents/FeishuTopics-Encrypted}
      - FEISHU_HOST_OPENER=http://host.docker.internal:18089
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data
      - ${FEISHU_HOST_DOWNLOADS:-${HOME}/Documents/FeishuTopics-Encrypted}:/downloads
    labels:
      dev.orbstack.domains: feishu-topics-encrypted.local
      dev.orbstack.http-port: "8087"
