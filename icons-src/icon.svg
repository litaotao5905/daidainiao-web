<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="飞书话题">
  <defs>
    <linearGradient id="bg" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3a7bff"/>
      <stop offset="0.55" stop-color="#1f9bd7"/>
      <stop offset="1" stop-color="#12c2a5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".24"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9f7f0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#06306b" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#shine)"/>
  <g filter="url(#sh)">
    <!-- thread line: root message -> reply -->
    <path d="M132 258v92a28 28 0 0 0 28 28h20" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- root message -->
    <rect x="84" y="86" width="300" height="176" rx="50" fill="#fff"/>
    <!-- reply in the thread -->
    <rect x="176" y="296" width="256" height="156" rx="50" fill="url(#b2)"/>
    <path d="M370 440h48l-14 44a5 5 0 0 1-9 1z" fill="#d9f7f0"/>
  </g>
  <g fill="#2f7be8">
    <rect x="124" y="132" width="220" height="28" rx="14"/>
    <rect x="124" y="182" width="140" height="28" rx="14" opacity=".5"/>
  </g>
  <g fill="#0fae93">
